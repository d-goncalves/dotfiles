# One-line prompt in the old format:  [~/path](branch↓1↑2|●1✖1✚1…) ->   ✔ when clean
# Colors use the terminal's palette, so they follow the "cactus" theme.
add_newline = false

format = "$directory$git_branch$git_status${custom.git_end}$character"

[directory]
format = "[\\[](bold red)[$path](bold yellow)[\\]](bold red)"
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = "[\\(](bold red)[$branch](bold purple)"

[git_status]
format = "$ahead_behind[|]()$staged$conflicted$modified$deleted$renamed$untracked"
staged = "[●$count](red)"
renamed = "[●$count](red)"
conflicted = "[✖$count](red)"
modified = "[✚$count](blue)"
deleted = "[✚$count](blue)"
untracked = "…"
stashed = ""
ahead = "↑$count"
behind = "↓$count"
diverged = "↓$behind_count↑$ahead_count"
up_to_date = ""

[character]
format = "$symbol"
success_symbol = "[ -> ](bold yellow)"
error_symbol = "[ -> ](bold yellow)"

# Closing parenthesis, with a green check mark first when the repo is clean (starship has no
# "clean" state of its own). Empty outside git repositories.
[custom.git_end]
when = "git rev-parse --is-inside-work-tree"
command = 'test -z "$(git status --porcelain 2>/dev/null)" && printf "✔"'
format = "[$output](bold green)[\\)]()"
