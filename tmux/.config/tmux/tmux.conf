# tmux config. No plugin manager: everything is in this file.

# The -q keeps older tmux versions quiet about options they do not know.
set -g default-terminal "tmux-256color"
set -asq terminal-features ",xterm*:RGB"
set -asq terminal-overrides ",xterm*:Tc"

# Panes run the shell you started tmux from, even when the login shell in the system settings differs
set -g default-shell "$SHELL"

set -g prefix C-a
unbind C-b
bind C-a send-prefix                        # ctrl-a twice sends it to the program

set -sg escape-time 10
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 5
set -g mouse on
set -g mode-keys vi
set -g status-keys emacs
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy on
set -g renumber-windows on
set -g aggressive-resize on
set -g bell-action none
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity on

# Windows and panes start at 1 and stay numbered without gaps
set -g base-index 1
setw -g pane-base-index 1

set -g allow-rename on
set -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#S: #W"

# ── Look: transparent status bar, so the terminal's pitch black shows through ─
set -g status-style bg=default
set -g message-style 'fg=white bg=default'
set -g pane-border-style 'fg=colour19 bg=colour0'
set -g pane-active-border-style 'fg=colour9 bg=colour0'
setw -g window-status-style 'fg=white bg=default bold'
setw -g window-status-format '#[fg=colour229]#I#[fg=colour239]:#[fg=colour1]#W#[fg=colour87]#F '
setw -g window-status-current-style 'fg=white bg=default bold'
setw -g window-status-current-format '#[fg=colour229]#I#[fg=colour239]:#[fg=colour1]#W#[fg=colour87]#F '
# Show a notice while all panes are in sync
set -ag status-right '#{?pane_synchronized, #[bg=red]IN SYNC#[default],}'

set -g allow-passthrough on
bind m set -g mouse \; display-message "mouse #{?mouse,on,off}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
bind q confirm-before kill-window
bind -n C-M-s setw synchronize-panes        # alt-ctrl-s: type into all panes at once

# New windows and splits start in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# prefix + hjkl moves between panes, prefix + HJKL resizes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ctrl-hjkl moves between tmux panes and nvim splits without the prefix
# (the tmux half of christoomey/vim-tmux-navigator, which the nvim config loads)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Search the scrollback, and copy to the system clipboard with whatever this machine has
# (tmux-clipboard-copy picks pbcopy, clip.exe or xclip)
set -s copy-command "tmux-clipboard-copy"   # also used by the default copy bindings (Enter in copy mode)
bind / copy-mode \; send-keys ?
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "tmux-clipboard-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "tmux-clipboard-copy"
