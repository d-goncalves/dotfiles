# tmux config. Plugins are installed by bootstrap.sh into ~/.local/share/tmux/plugins.

# ── General ───────────────────────────────────────────────────────────────────
set -g default-shell "$SHELL"
set -sg escape-time 0
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -s set-clipboard on
set -g bell-action none
set -g set-titles on
set -g allow-rename on
setw -g mode-keys vi
setw -g monitor-activity on

# Windows and panes start at 1 and stay numbered without gaps
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Colors: true color through the terminal. The -q keeps older tmux versions quiet.
set -g default-terminal "tmux-256color"
set -asq terminal-features ',xterm*:RGB'
set -asq terminal-overrides ',xterm*:Tc'

# ── Keys ──────────────────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix                        # ctrl-a twice sends it to the program
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
bind q confirm-before kill-window
bind -n C-M-s setw synchronize-panes        # alt-ctrl-s: type into all panes at once
bind / copy-mode \; send-key ?              # prefix + / searches the scrollback

# ── Copy to the system clipboard with whatever this machine has ───────────────
if-shell 'uname | grep -q Darwin' "set -s copy-command 'pbcopy'"
if-shell 'grep -qi microsoft /proc/version 2>/dev/null' "set -s copy-command 'clip.exe'"
if-shell 'command -v xclip >/dev/null 2>&1 && [ -n "$DISPLAY" ]' "set -s copy-command 'xclip -selection clipboard -i'"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# ── Look: transparent status bar, so the terminal's pitch black shows through ─
set -g status-style bg=default
set -g message-style 'fg=white bg=default'
set -g pane-border-style 'fg=colour19'
set -g pane-active-border-style 'fg=colour9'

setw -g window-status-current-style 'fg=white bg=default bold'
setw -g window-status-current-format '#[fg=colour229]#I#[fg=colour14]#[fg=colour239]:#[fg=colour1]#W#[fg=colour87]#F '
setw -g window-status-style 'fg=white bg=default bold'
setw -g window-status-format '#[fg=colour229]#I#[fg=colour239]:#[fg=colour1]#W#[fg=colour87]#F '

# Show a notice while all panes are in sync
set -ag status-right '#{?pane_synchronized, #[bg=red]IN SYNC#[default],}'

# ── Plugins (keep this at the bottom) ─────────────────────────────────────────
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'               # plugin manager
set -g @plugin 'tmux-plugins/tmux-sensible'     # sane defaults (only changes untouched settings)
set -g @plugin 'nhdaly/tmux-better-mouse-mode'  # proper mouse scrolling
set -g @plugin 'tmux-plugins/tmux-pain-control' # pane control, prefix + hjkl
set -g @plugin 'christoomey/vim-tmux-navigator' # ctrl-hjkl moves between nvim splits and panes
run -b "$HOME/.local/share/tmux/plugins/tpm/tpm"
