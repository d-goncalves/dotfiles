[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[font]
size = 11

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[scrolling]
history = 100000

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[window]
# decorations = "none"
opacity = 1

# Pitch black background, colors from the nvim theme dark_flat.
# Its own palette (the "cactus" one); iTerm and Windows Terminal use Vivid Black, see desktop/palette.json
[colors.primary]
background = "#000000"
foreground = "#b0bec4"

[colors.cursor]
cursor = "#b0bec4"
text = "#000000"

[colors.selection]
background = "#313244"
text = "#fefefe"

[colors.normal]
black = "#1e2024"
red = "#d54e53"
green = "#3dd177"
yellow = "#ffc900"
blue = "#00b0ff"
magenta = "#c678dd"
cyan = "#64fcda"
white = "#b0bec4"

[colors.bright]
black = "#676e7b"
red = "#ee2c68"
green = "#82f4a2"
yellow = "#ffe47e"
blue = "#66d0ff"
magenta = "#d7a0e7"
cyan = "#a2fde9"
white = "#fefefe"
