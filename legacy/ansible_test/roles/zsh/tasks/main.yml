---
- name: Install zsh (Debian/Ubuntu)
  ansible.builtin.apt:
    name: zsh
    state: present
  when: ansible_os_family == "Debian"

- name: Install zsh (macOS)
  ansible.builtin.homebrew:
    name: zsh
    state: present
  when: ansible_os_family == "Darwin"

- name: Install git (Debian/Ubuntu)
  ansible.builtin.apt:
    name: git
    state: present
  when: ansible_os_family == "Debian"

- name: Install git (macOS)
  ansible.builtin.homebrew:
    name: git
    state: present
  when: ansible_os_family == "Darwin"

- name: Install Oh My Zsh
  ansible.builtin.shell:
    cmd: 'sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended'
    creates: "{{ ansible_user_dir }}/.oh-my-zsh"

- name: Install zsh-autosuggestions plugin
  ansible.builtin.git:
    repo: 'https://github.com/zsh-users/zsh-autosuggestions.git'
    dest: "{{ ansible_user_dir }}/.oh-my-zsh/plugins/zsh-autosuggestions"
    depth: 1

- name: Install zsh-syntax-highlighting plugin
  ansible.builtin.git:
    repo: 'https://github.com/zsh-users/zsh-syntax-highlighting.git'
    dest: "{{ ansible_user_dir }}/.oh-my-zsh/plugins/zsh-syntax-highlighting"
    depth: 1

- name: Create custom zsh themes directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.oh-my-zsh/custom/themes"
    state: directory
    mode: '0755'

- name: Copy custom git_status theme
  ansible.builtin.copy:
    content: |
      # Git status prompt theme
      # Shows git branch and status in prompt
      autoload -Uz vcs_info
      precmd_vcs_info() { vcs_info }
      precmd_functions+=( precmd_vcs_info )
      setopt prompt_subst
      zstyle ':vcs_info:git:*' formats ' %F{green}(%b)%f'
      zstyle ':vcs_info:*' enable git
      
      PROMPT='%F{cyan}%n%f@%F{yellow}%m%f:%F{blue}%~%f${vcs_info_msg_0_}$ '
      RPROMPT='%(?..%F{red}[%?]%f)'
    dest: "{{ ansible_user_dir }}/.oh-my-zsh/custom/themes/git_status.zsh-theme"
    mode: '0644'

- name: Create .zshrc with git_status theme
  ansible.builtin.copy:
    content: |
      export ZSH="{{ ansible_user_dir }}/.oh-my-zsh"
      ZSH_THEME="git_status"
      
      plugins=(
          git
          zsh-autosuggestions
          zsh-syntax-highlighting
      )
      
      source $ZSH/oh-my-zsh.sh
      
      # Custom aliases
      alias ll='ls -la'
      alias la='ls -A'
      alias l='ls -CF'
      alias gs='git status'
      alias ga='git add'
      alias gc='git commit'
      alias gp='git push'
      alias gl='git pull'
    dest: "{{ ansible_user_dir }}/.zshrc"
    mode: '0644'
    backup: yes

- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: /bin/zsh
  become: true

- name: Install additional git utilities (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - git-extras
    - delta
  when: ansible_os_family == "Debian"

- name: Install additional git utilities (macOS)
  ansible.builtin.homebrew:
    name: "{{ item }}"
    state: present
  loop:
    - git-extras
    - git-delta
  when: ansible_os_family == "Darwin"