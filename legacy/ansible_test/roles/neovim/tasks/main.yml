---
- name: Install neovim dependencies (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop:
    - ninja-build
    - gettext
    - cmake
    - curl
    - build-essential
    - libtool
    - libtool-bin
    - autoconf
    - automake
    - g++
    - pkg-config
    - unzip
  when: ansible_os_family == "Debian"

- name: Install neovim dependencies (macOS)
  ansible.builtin.homebrew:
    name: "{{ item }}"
    state: present
  loop:
    - ninja
    - gettext
    - cmake
    - curl
    - libtool
    - autoconf
    - automake
    - pkg-config
    - unzip
  when: ansible_os_family == "Darwin"

- name: Git checkout
  ansible.builtin.git:
    repo: 'https://github.com/neovim/neovim'
    dest: /tmp/neovim/
    single_branch: true
    version: master

- name: Build nvim release version
  community.general.make:
    chdir: /tmp/neovim
    params:
      CMAKE_BUILD_TYPE: Release

- name: Install nvim release version
  become: true
  community.general.make:
    chdir: /tmp/neovim
    target: install
  when: ansible_os_family == "Debian"

- name: Install nvim release version (macOS)
  community.general.make:
    chdir: /tmp/neovim
    target: install
  when: ansible_os_family == "Darwin"

- name: Install pynvim
  ansible.builtin.pip:
    name:
      - pynvim
    state: present
    executable: pip3

- name: Generate :help pages
  ansible.builtin.shell: nvim --headless -c 'helptags ALL' -c quit

- name: Install Treesitter parsers
  ansible.builtin.shell: nvim --headless -c 'TSUpdateSync' -c quit
